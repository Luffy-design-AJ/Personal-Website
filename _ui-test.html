<!doctype html><meta charset="utf-8">
<body style="margin:0">
<iframe id="f" src="projects.html#palate" style="width:1200px;height:1000px;border:0"></iframe>
<pre id="out">running</pre>
<script>
(function () {
  var out = [];
  function p(s) { out.push(s); }
  function done() { document.getElementById("out").textContent = out.join("\n"); }
  window.addEventListener("load", function () {
    setTimeout(function () {
      try {
        var f = document.getElementById("f");
        var d = f.contentDocument, w = f.contentWindow;
        var log = d.querySelector(".palate__log");
        var picks = [10, 1, 3, 11, 11, 5, 3];
        for (var step = 0; step < picks.length; step++) {
          var blocks = d.querySelectorAll(".palate__block");
          var block = blocks[blocks.length - 1];
          var buttons = block ? block.querySelectorAll(".palate__opt[data-aid]") : [];
          if (!buttons.length) { p("NO BUTTONS at step " + (step + 1)); break; }
          var pick = picks[step];
          p("STEP " + (step + 1) + " pick=" + pick + " of " + buttons.length +
            " label=" + buttons[pick - 1].textContent);
          buttons[pick - 1].click();
        }
        setTimeout(function () {
          var text = log.textContent;
          p("---- LOG ----");
          p(text);
          p("---- CHECKS ----");
          p("has 7 answers: " + /RECOMMENDED after 7 answers/.test(text));
          p("has Hunan: " + /Hunan Rice Stew/.test(text));
          p("has p=0.85: " + /p=0\.85/.test(text));
          p("has why: " + /\+2\.40  "Chinese"/.test(text));
          p("form hidden: " + d.querySelector(".palate__form").hidden);
          p("log scroll: " + log.scrollHeight + "/" + log.clientHeight);
          p("page overflow: " + (d.documentElement.scrollWidth > d.documentElement.clientWidth));
          p("term height: " + Math.round(d.querySelector(".term--live").getBoundingClientRect().height));
          done();
        }, 300);
      } catch (err) {
        p("ERROR " + err.message + "\n" + err.stack);
        done();
      }
    }, 2000);
  });
})();
</script>
</body>
</html>
